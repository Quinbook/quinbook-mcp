services:
  quinbook-mcp-remote:
    build: .
    image: quinbook-mcp-remote:latest
    container_name: quinbook-mcp-remote
    restart: unless-stopped
    ports:
      # host:container — HAProxy backend_mcp points at <dockerhost-ip>:8787
      - "8787:8787"
    environment:
      PORT: "8787"
      # Production: talks to the live CoreApi. The CoreApi OAuth changes
      # (well-known metadata, /v1/auth/register, code_verifier fix, auth_mode)
      # MUST be deployed to prod first, otherwise the OAuth flow breaks.
      QUINBOOK_API_BASE_URL: "https://api.quinbook.com"
      MCP_PUBLIC_URL: "https://mcp.quinbook.com"
